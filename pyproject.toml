[project]
name = "hello-mujoco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "mujoco>=3.14.0",
    "pillow>=12.3.0",
    "imageio>=2.37.4",
    "numpy",
    "opencv-python",
    "pyqt5>=5.15.11",
]

[project.scripts]
hello-mujoco = "hello_mujoco:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
